<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img"><title>Akagi (three-deck conversion)</title><desc>Akagi original 1927–30 carrier conversion: three flight-deck levels, no island, short upper deck with a slight aft slope, two pole masts and the distinctive starboard two-level uptake with a large downturned funnel and smaller upward outlet. Two twin 200 mm turrets forward and six single aft casemate guns; only near-side mounts visible. This original profile is not the post-1938 full-flight-deck/island conversion.</desc><rect width="1100" height="340" fill="white"/><g fill="white" stroke="black" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M50 241 Q121 237 203 240 H973 L1048 252 Q1040 271 998 280 H89 L67 263Z" stroke-width="2" fill="white"/><path d="M78 265 H1022" stroke-width="1" fill="white"/><path d="M66 226 H283 V207 H329 V168 L962 183 V237 H1030 V249 H247 V240 H66Z" stroke-width="2" fill="white"/><path d="M286 161 Q604 164 1027 179 L1025 185 Q604 170 286 167Z" stroke-width="2" fill="white"/><path d="M60 213 H276 V220 H63Z" stroke-width="2" fill="white"/><path d="M227 192 H329 V199 H227Z" stroke-width="2" fill="white"/><path d="M90 220 V229" stroke-width="1.5" fill="none"/><path d="M150 220 V229" stroke-width="1.5" fill="none"/><path d="M210 220 V229" stroke-width="1.5" fill="none"/><path d="M267 220 V229" stroke-width="1.5" fill="none"/><path d="M248 199 V213" stroke-width="1.5" fill="none"/><path d="M275 199 V213" stroke-width="1.5" fill="none"/><path d="M305 199 V213" stroke-width="1.5" fill="none"/><path d="M961 186 V249" stroke-width="2" fill="none"/><path d="M992 186 V249" stroke-width="2" fill="none"/><path d="M1024 186 V249" stroke-width="2" fill="none"/><path d="M970 189 L1001 242 M1001 191 L970 240" stroke-width="1" fill="none"/><path d="M487 178 Q541 184 552 203 L546 226 H505 Q485 207 487 178Z" stroke-width="2" fill="white"/><path d="M517 174 V156 Q530 149 543 157 V174Z" stroke-width="2" fill="white"/>