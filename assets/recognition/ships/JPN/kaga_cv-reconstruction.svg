<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img"><title>Kaga (three-deck conversion)</title><desc>Kaga original 1928–30 carrier conversion: three deck levels, no island, a horizontal shortened upper landing deck, two pole masts and long side exhaust ducts discharging aft. Two twin 200 mm turrets forward and six single aft casemate guns, with near-side mounts visible. The aft-running exhaust trunk distinguishes Kaga from Akagi; the post-1935 island and full-length deck are excluded.</desc><rect width="1100" height="340" fill="white"/><g fill="white" stroke="black" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M50 244 Q163 239 211 241 H1011 L1050 258 L1040 277 H73Z" stroke-width="2" fill="white"/><path d="M76 265 H1038" stroke-width="1" fill="white"/><path d="M59 218 H229 V197 H293 V163 H998 V248 H235 V240 H59Z" stroke-width="2" fill="white"/><path d="M286 154 H1050 L1045 163 H286Z" stroke-width="2" fill="white"/><path d="M57 211 H233 V220 H57Z" stroke-width="2" fill="white"/><path d="M231 190 H304 V197 H231Z" stroke-width="2" fill="white"/><path d="M958 163 V248" stroke-width="2" fill="none"/><path d="M994 163 V248" stroke-width="2" fill="none"/><path d="M1034 163 V248" stroke-width="2" fill="none"/><path d="M969 165 L1027 238 M1027 165 L969 238" stroke-width="1" fill="none"/><path d="M402 169 Q388 175 402 196 L1015 220 V238 H983 V226 L412 214 Q380 210 378 188 V172Z" stroke-width="2" fill="white"/><path d="M426 194 L1006 218" stroke-width="1" fill="white"/><path d="M350.0 196 V57" stroke-width="2" fill="none"/><path d="M328.0 84 H372.0 M334.0 111 H374.0" stroke-width="1" fill="none"/><path d="M645.0 170 V39" stroke-width="2" fill="none"/><path d="M623.0 66 H667.0 M629.0 93 H669.0" stroke-width="1" fill="none"/><g id="gun-0.245" transform="translate(295.0 195)"><path d="M-13 0 V-15 Q-13 -20 -6 -20 H10 L16 -10 V0Z" stroke-width="2" fill="white"/><path d="M-9 -15 H-49" stroke-width="3" fill="white"/><path d="M-9 -10 H-