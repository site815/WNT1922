<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1200 570"><title>Sikorsky Ilya Muromets G-3 Renobalt</title><desc>Ilya Muromets G-3 Renobalt bomber configuration used as the explicit late-family reference: four wing-mounted inline tractor engines (two Renault and two RBVZ-6), unequal biplane wings, glazed cabin, overhead fuel tanks, two outboard rudders, central upper/lower fins and tail gun position. Fixed wheels, protective runners and tail skid. Port profile; opposite engine and rudder stations overlap. The game’s generic family entry does not assert this exact variant performance or internal seating.</desc><metadata id="recognition-profile">{&quot;format&quot;:1,&quot;method&quot;:&quot;Independent type-specific port-profile geometry from primary factual references&quot;,&quot;view&quot;:&quot;profile&quot;,&quot;referenceDimensions&quot;:true,&quot;length_m&quot;:17.1,&quot;span_m&quot;:30.87,&quot;engineCount&quot;:4,&quot;engineLayout&quot;:&quot;four tractor engines: two inboard Renault and two outboard RBVZ-6&quot;,&quot;wingPlanes&quot;:2,&quot;boatHull&quot;:false,&quot;floatCount&quot;:0,&quot;rudderCount&quot;:2,&quot;overheadFuelTankCount&quot;:2,&quot;gear&quot;:&quot;fixed wheels with protective runners and tail skid&quot;,&quot;limitations&quot;:&quot;Recognition profile only. Minor contours and fittings are simplified independent choices. Opposite engines, floats and tail surfaces overlap in profile; no unseen front or plan views asserted.&quot;}</metadata><rect width="1200" height="570" fill="white"/><g id="profile" fill="black" stroke-linejoin="round"><g data-feature="fuselage" ><path d="M126 324Q128 284 162 276L292 274L329 285L431 289L578 297L886 311L1040 307L1076 329L1032 351L838 362L563 380L286 398L164 394Q131 381 126 324Z" fill="black"/><path d="M134 352L278 383L567 367L1033 340M308 301L307 388M438 304L438 378M574 309L573 369M733 315L733 360M847 320L847 355" fill="none" stroke="white" stroke-width="1.4" stroke-l