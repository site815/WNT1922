<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 687.606" role="img" aria-labelledby="title desc"><title id="title">Kaichu type — original recognition diagram</title><desc id="desc">Early Kaichu I family proportions and aft-of-tower deck gun, informed by the 1919 Ro-11 photograph. This is an original interpretation of the game’s mixed early Kaichu aggregate, not a claim of an exact Ro-11 fit: the catalog abstracts all six tubes as internal, while individual early boats also carried external trainable tubes. Fine casing and plan detail are reconstructed; no later Kaichu VII conning tower or foredeck gun is substituted.</desc><metadata id="recognition-geometry">{&quot;schema&quot;:1,&quot;kind&quot;:&quot;submarine&quot;,&quot;platformId&quot;:&quot;kaichu&quot;,&quot;length_m&quot;:69.19,&quot;beam_m&quot;:6.35,&quot;dimensionsAreReferenceProportions&quot;:true,&quot;scale_px_per_m&quot;:24.859083682613097,&quot;hullDatums&quot;:{&quot;profile&quot;:{&quot;x&quot;:100,&quot;y&quot;:295,&quot;length&quot;:1720},&quot;plan&quot;:{&quot;x&quot;:100,&quot;y&quot;:540,&quot;length&quot;:1720}},&quot;mainBarrels&quot;:1,&quot;internalTorpedoTubes&quot;:6,&quot;stations&quot;:[{&quot;id&quot;:&quot;conning-tower&quot;,&quot;role&quot;:&quot;tower&quot;,&quot;x_m&quot;:25.254,&quot;length_m&quot;:6.1,&quot;beam_m&quot;:2.54},{&quot;id&quot;:&quot;periscope-0&quot;,&quot;role&quot;:&quot;periscope&quot;,&quot;x_m&quot;:23.525,&quot;base_y&quot;:246.52478681890446},{&quot;id&quot;:&quot;periscope-1&quot;,&quot;role&quot;:&quot;periscope&quot;,&quot;x_m&quot;:26.292,&quot;base_y&quot;:246.52478681890446},{&quot;id&quot;:&quot;gun-0&quot;,&quot;role&quot;:&quot;main&quot;,&quot;x_m&quot;:42.552,&quot;caliber_mm&quot;:76,&quot;barrels&quot;:1,&quot;direction&quot;:1,&quot;length_m&quot;:1.25,&quot;beam_m&quot;:0.8749999999999999},{&quot;id&quot;:&quot;hatch-0&quot;,&quot;role&quot;:&quot;hatch&quot;,&quot;x_m&quot;:9.687},{&quot;id&quot;:&quot;hatch-1&quot;,&quot;role&qu