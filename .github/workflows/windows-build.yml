name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WNT_TEST_PUBLIC: game/staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build test assets
        run: node tools/build-game.mjs game/staging
      - name: Audit assets
        run: node tools/audit-assets.mjs
      - name: Regression tests
        run: node --test --test-isolation=none --test-skip-pattern='old campaign migration|untouched old opening|all selectable countries|multi-year campaign' game/test/*.test.mjs
      - name: Build portable Windows package
        shell: pwsh
        run: ./tools/Package-Windows.ps1
      - name: Install executable test driver (not included in game)
        run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - name: Test executable launch, gameplay and save/reopen
        run: node tools/check-desktop.mjs
      - name: Upload distributable ZIP and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WNT1922-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
